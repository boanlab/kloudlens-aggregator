---
apiVersion: v1
kind: Namespace
metadata:
  name: kloudlens
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    boanlab.com/app: kloudlens-aggregator
  name: kloudlens-aggregator
  namespace: kloudlens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    boanlab.com/app: kloudlens-aggregator
  name: kloudlens-aggregator
rules:
# EndpointSlice watch is what discovers the kloudlens DaemonSet pods so the
# aggregator can re-subscribe automatically when nodes roll. The same
# cluster-scoped watch also feeds the cross-node PodEndpointIndex (resolving a
# DNATed pod endpoint to its backing workload).
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
# Services back the ServiceIndex used by --resolve-service-vip (default on),
# which resolves a Service ClusterIP (VIP) connect to the backend workload
# kube-proxy DNATs it to. Without this the VIP half of cross-node attribution
# silently resolves nothing (kloudlens_agg_services_watched stays 0).
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    boanlab.com/app: kloudlens-aggregator
  name: kloudlens-aggregator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudlens-aggregator
subjects:
- kind: ServiceAccount
  name: kloudlens-aggregator
  namespace: kloudlens
---
apiVersion: v1
kind: Service
metadata:
  name: kloudlens-aggregator
  namespace: kloudlens
  labels:
    boanlab.com/app: kloudlens-aggregator
spec:
  selector:
    boanlab.com/app: kloudlens-aggregator
  ports:
  - name: metrics
    port: 9091
    targetPort: 9091
  - name: reexport
    port: 9450
    targetPort: 9450
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudlens-aggregator
  namespace: kloudlens
  labels:
    boanlab.com/app: kloudlens-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      boanlab.com/app: kloudlens-aggregator
  template:
    metadata:
      labels:
        boanlab.com/app: kloudlens-aggregator
    spec:
      serviceAccountName: kloudlens-aggregator
      terminationGracePeriodSeconds: 5
      containers:
      - name: aggregator
        image: boanlab/kloudlens-aggregator:latest
        # IfNotPresent so a node-local (side-loaded via `ctr images import`)
        # image is used as-is. `Always` forces a registry pull on every start,
        # which fails (ImagePullBackOff) for locally built / air-gapped images.
        # Matches the agent and CLI manifests, which already use IfNotPresent.
        imagePullPolicy: IfNotPresent
        # The aggregator binary's ENTRYPOINT defaults to --help; override it
        # with the real flags here. EndpointSlice discovery follows the
        # headless service that fronts the kloudlens DaemonSet (port name
        # "events" = 8181 in deployments/manifests/daemonset.yaml).
        args:
        - --k8s-service=kloudlens/kloudlens-admin
        - --agent-port=8181
        - --streams=intent
        - --metrics-addr=:9091
        - --reexport-addr=:9450
        - --wal-dir=/var/lib/kloudlens-aggregator/wal
        - --cursor-file=/var/lib/kloudlens-aggregator/cursors.json
        ports:
        - name: metrics
          containerPort: 9091
        - name: reexport
          containerPort: 9450
        volumeMounts:
        - name: state
          mountPath: /var/lib/kloudlens-aggregator
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: state
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
